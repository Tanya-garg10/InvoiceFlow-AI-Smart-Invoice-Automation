services:
  - type: web
    name: invoiceflow-ai
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
        generateValue: true
      - key: USE_NPM_INSTALL
        value: true
    autoDeploy: true